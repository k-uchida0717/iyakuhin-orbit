<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#03050c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%226%22 fill=%22%237dffcf%22/%3E%3Cellipse cx=%2220%22 cy=%2220%22 rx=%2217%22 ry=%227%22 fill=%22none%22 stroke=%22%234fe3ff%22 stroke-width=%222%22 transform=%22rotate(-25 20 20)%22/%3E%3C/svg%3E">
<title>保険診療オービット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: deep-space control deck — starfield canvas behind everything; home = orbit map of three data "planets" + cross search;
   each module = glass instrument panels in one 760px column; bottom dock for navigation. Single deliberate dark look. */
:root{
  color-scheme:dark;
  --void:#03050c; --deep:#081026; --nebula-a:#1b1f5e; --nebula-b:#0d3a4f;
  --glass:rgba(140,170,255,.065); --glass-hi:rgba(140,170,255,.12); --rim:rgba(150,185,255,.20); --rim-hi:rgba(170,205,255,.42);
  --text:#e9efff; --dim:#95a2cc; --faint:#5d6993;
  --yakka:#4fe3ff; --kensa:#b38cff; --ryuui:#ffc46b; --dpc:#ff6fae; --byomei:#9dff6f; --core:#7dffcf;
  --up:#ff7d8e; --down:#6fb9ff; --warn:#ffcf70;
  --mod:var(--core);
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-tech:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html,body{background:var(--void);color:var(--text)}
body{font-family:var(--f-jp);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100%}
body[data-mod="yakka"]{--mod:var(--yakka)} body[data-mod="kensa"]{--mod:var(--kensa)} body[data-mod="ryuui"]{--mod:var(--ryuui)} body[data-mod="dpc"]{--mod:var(--dpc)} body[data-mod="byomei"]{--mod:var(--byomei)}
html,body{overflow-x:clip}
/* 背景の装飾は画面幅を超えて描くので、画面ぴったりの固定枠の中に閉じ込める */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.nebula{position:absolute;inset:-20%;
  background:radial-gradient(40% 35% at 18% 12%,rgba(79,227,255,.13),transparent 70%),
             radial-gradient(45% 40% at 88% 30%,rgba(179,140,255,.14),transparent 70%),
             radial-gradient(50% 40% at 50% 105%,rgba(255,196,107,.08),transparent 70%)}
.horizon{position:absolute;left:-50%;right:-50%;bottom:-2px;height:38vh;opacity:.35;
  background-image:linear-gradient(rgba(125,255,207,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(125,255,207,.35) 1px,transparent 1px);
  background-size:56px 56px;transform:perspective(420px) rotateX(64deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 85%);mask-image:linear-gradient(to top,#000 0%,transparent 85%)}
.shell{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mod);outline-offset:2px}
a{color:var(--mod)}

/* ---------- テーマ：大海原と夏の日差し（医薬品アプリ） ---------- */
body.theme-ocean{
  --void:#021a33; --deep:#06325e;
  --glass:rgba(3,38,78,.58); --glass-hi:rgba(8,62,118,.66); --rim:rgba(255,222,120,.26); --rim-hi:rgba(255,222,120,.55);
  --text:#f6fbff; --dim:#bcd6ee; --faint:#86aed0;
  --yakka:#ffd23f; --core:#5fe3ff; --kensa:#7fd8ff; --ryuui:#ffe28a;
  --up:#ff8a7a; --down:#7fd0ff; --warn:#ffd86b;
  background:#021a33}
body.theme-ocean[data-mod="yakka"],body.theme-ocean:not([data-mod]),body.theme-ocean[data-mod=""]{--mod:#ffd23f}
body.theme-ocean .backdrop{background:
  radial-gradient(60% 42% at 86% -6%,#fff3b0 0%,#ffd23f 22%,rgba(255,196,40,.55) 42%,rgba(255,196,40,0) 70%),
  radial-gradient(90% 30% at 80% 36%,rgba(255,226,140,.28),rgba(255,226,140,0) 70%),
  linear-gradient(180deg,#1592d6 0%,#0f73b8 22%,#0b5596 36%,#073c74 52%,#04274f 74%,#021a33 100%)}
body.theme-ocean .nebula{background:conic-gradient(from 200deg at 86% -6%,rgba(255,236,160,0) 0deg,rgba(255,236,160,.12) 8deg,rgba(255,236,160,0) 16deg,rgba(255,236,160,.08) 26deg,rgba(255,236,160,0) 34deg,rgba(255,236,160,.1) 46deg,rgba(255,236,160,0) 58deg);inset:0}
body.theme-ocean .horizon{display:none}
body.theme-ocean .bar{background:linear-gradient(to bottom,rgba(2,30,62,.9) 60%,rgba(2,30,62,0))}
body.theme-ocean h2.h,body.theme-ocean .lead{text-shadow:0 2px 14px rgba(0,20,50,.55)}
body.theme-ocean .search input{background:rgba(2,30,62,.78)}
body.theme-ocean nav.dock .in{background:rgba(2,30,62,.86)}
body.theme-ocean .sheet{background:linear-gradient(to bottom,rgba(6,52,100,.98),rgba(2,22,46,.99));box-shadow:0 -20px 60px -20px #ffd23f}
body.theme-ocean .sheet .top{background:#063464}
body.theme-ocean .node .globe{background:radial-gradient(circle at 40% 35%,#fffbe0 0%,#ffe066 25%,#ffb703 60%,#c76b00 100%);box-shadow:0 0 60px 6px rgba(255,210,63,.7),0 0 0 1px rgba(255,240,180,.8) inset}
body.theme-ocean .core{background:radial-gradient(circle,rgba(95,227,255,.25),rgba(95,227,255,0) 70%)}
body.theme-ocean .login{background:radial-gradient(60% 45% at 85% 0%,rgba(255,210,63,.45),rgba(255,210,63,0) 70%),linear-gradient(180deg,#0f73b8,#04274f 70%,#021a33)}
body.theme-ocean mark{background:rgba(255,210,63,.35)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding-block:12px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(to bottom,rgba(3,5,12,.92) 60%,rgba(3,5,12,0));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo svg{width:34px;height:34px;flex:none}
.logo b{display:block;font-weight:900;font-size:17px;letter-spacing:.06em;line-height:1.1}
.logo small{display:block;font-family:var(--f-tech);font-size:10px;letter-spacing:.32em;color:var(--dim)}
.bar .sp{flex:1}
.chip-live{font-family:var(--f-tech);font-size:10.5px;letter-spacing:.12em;color:var(--core);border:1px solid rgba(125,255,207,.35);border-radius:999px;padding:3px 9px;white-space:nowrap;display:flex;align-items:center;gap:6px}
@media (max-width:420px){.chip-live:not(.out){display:none}.chip-live.out{padding:3px 7px;font-size:10px}.logo small{letter-spacing:.18em}}
.chip-live i{width:6px;height:6px;border-radius:50%;background:var(--core);box-shadow:0 0 8px var(--core)}

/* ---------- glass primitives ---------- */
.panel{background:var(--glass);border:1px solid var(--rim);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.eyebrow{font-family:var(--f-tech);font-size:11px;letter-spacing:.28em;color:var(--mod);text-transform:uppercase}
h2.h{font-weight:900;font-size:clamp(22px,6vw,30px);line-height:1.25;margin:4px 0 6px;letter-spacing:.02em;text-wrap:balance}
.lead{color:var(--dim);font-size:13.5px;margin:0}
.search{position:relative;margin-top:12px}
.search input{width:100%;min-width:0;font-size:16px;padding:14px 16px 14px 46px;border-radius:999px;border:1px solid var(--rim-hi);
  background:rgba(8,16,38,.75);color:var(--text);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 28px -8px var(--mod) inset}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--mod);box-shadow:0 0 0 3px color-mix(in srgb,var(--mod) 25%,transparent),0 0 30px -6px var(--mod)}
.search svg{position:absolute;left:17px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--mod);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--rim);background:var(--glass);color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--mod);color:var(--void);background:var(--mod);font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--rim);background:rgba(8,16,38,.6);margin-top:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:6px 4px;font-family:var(--f-tech);font-weight:600;font-size:12.5px;line-height:1.2;color:var(--dim)}
.seg button small{display:block;font-family:var(--f-jp);font-weight:400;font-size:10px}
.seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--mod) 18%,transparent);color:var(--mod);box-shadow:0 0 0 1px color-mix(in srgb,var(--mod) 55%,transparent) inset}
.tabs2{display:flex;gap:18px;border-bottom:1px solid var(--rim);margin-top:14px}
.tabs2 button{background:none;border:0;padding:8px 0;color:var(--dim);font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-selected="true"]{color:var(--text);border-color:var(--mod)}

/* ---------- home: orbit map ---------- */
.hero{padding-top:8px}
.orbit-wrap{position:relative;width:min(100%,420px);aspect-ratio:1;margin:18px auto 4px;max-width:100%}
.orbit-wrap svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spin{position:absolute;inset:0;animation:spin 140s linear infinite}
.node{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:0;padding:0;background:none;animation:spin 140s linear infinite reverse;color:var(--text)}
.node .globe{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff8 0%,var(--c) 18%,color-mix(in srgb,var(--c) 30%,#050818) 70%);box-shadow:0 0 34px -4px var(--c),0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent) inset;transition:transform .25s}
.node:hover .globe,.node:focus-visible .globe{transform:scale(1.07)}
.node .lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);white-space:nowrap;text-align:center;font-weight:900;font-size:14px;text-shadow:0 1px 8px #000}
.node .lbl small{display:block;font-family:var(--f-tech);font-weight:600;font-size:11px;color:var(--c);letter-spacing:.06em}
.node .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-tech);font-weight:700;font-size:15px;color:#04101a;text-shadow:0 0 6px #fff9}
.core{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle,rgba(125,255,207,.22),rgba(125,255,207,0) 70%)}
.core b{font-weight:900;font-size:14px;letter-spacing:.14em;line-height:1.3}
.core small{display:block;font-family:var(--f-tech);font-size:10px;color:var(--core);letter-spacing:.25em}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
.ring-pulse{animation:pulse 4s ease-in-out infinite}
.sat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}
.sat{padding:12px;border-radius:var(--r);background:var(--glass);border:1px solid var(--rim);position:relative;overflow:hidden;text-align:left;color:var(--text)}
.sat::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--c);box-shadow:0 0 12px var(--c)}
.sat .k{font-size:11.5px;color:var(--dim);font-weight:700}
.sat .v{font-family:var(--f-tech);font-weight:700;font-size:22px;color:var(--c);line-height:1.2}
.sat .s{font-size:10.5px;color:var(--faint);line-height:1.4}
.mini-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.06)}
.mini-bar i{display:block}
@media (max-width:520px){.sat-grid{grid-template-columns:1fr}.sat{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px}.sat .mini-bar{grid-column:1/-1}}

/* ---------- lists & cards ---------- */
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px 0 8px;font-family:var(--f-tech);font-size:12px;letter-spacing:.06em;color:var(--dim)}
.list{display:flex;flex-direction:column;gap:8px}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:12px 14px 12px 16px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--rim);cursor:pointer;transition:border-color .2s,background .2s;text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--mod));box-shadow:0 0 10px var(--c,var(--mod))}
.card:hover{border-color:var(--rim-hi);background:var(--glass-hi)}
.card .nm{font-weight:700;font-size:15.5px;line-height:1.4;word-break:break-all}
.card .sub{grid-column:1/2;font-size:12.5px;color:var(--dim);word-break:break-all}
.card .code{font-family:var(--f-tech);font-weight:600;color:var(--c,var(--mod));margin-right:6px;letter-spacing:.04em}
.val{text-align:right;white-space:nowrap;font-family:var(--f-tech);font-variant-numeric:tabular-nums}
.val .v{font-size:21px;font-weight:700;letter-spacing:.01em}
.val .u{font-family:var(--f-jp);font-size:11px;color:var(--dim);margin-left:2px}
.row2{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.tags{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--rim);color:var(--dim);white-space:nowrap}
.tag.s{border-color:var(--yakka);color:var(--yakka)}
.tag.g{border-color:var(--core);color:var(--core)}
.tag.w{border-color:var(--warn);color:var(--warn)}
.delta{font-family:var(--f-tech);font-weight:700;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.dn{color:var(--down)} .delta.up{color:var(--up)} .delta.eq{color:var(--faint)}
.snip{grid-column:1/-1;font-size:12.5px;color:var(--dim);line-height:1.55;border-top:1px dashed var(--rim);padding-top:6px;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.snip b{font-family:var(--f-tech);font-size:10.5px;letter-spacing:.12em;color:var(--c,var(--mod));margin-right:6px}
mark{background:color-mix(in srgb,var(--mod) 30%,transparent);color:var(--text);border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px color-mix(in srgb,var(--mod) 60%,transparent)}
.more{width:100%;margin-top:10px;padding:11px;border-radius:999px;border:1px dashed var(--rim-hi);background:transparent;color:var(--mod);font-weight:700}
.empty{padding:22px 16px;border-radius:var(--r);border:1px dashed var(--rim);color:var(--dim);text-align:center;font-size:13.5px}
.grp-h{font-family:var(--f-tech);font-size:11px;letter-spacing:.2em;color:var(--dim);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.grp-h::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--rim),transparent)}
.xsec{margin-top:18px}
.xsec h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;font-weight:900}
.xsec h3 i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.xsec h3 span{font-family:var(--f-tech);font-weight:600;color:var(--dim);font-size:12px}
.xsec h3 button{margin-left:auto;background:none;border:0;color:var(--c);font-size:12.5px;font-weight:700}
.loading{padding:36px 0;text-align:center;font-family:var(--f-tech);letter-spacing:.2em;color:var(--dim)}
.loading i{display:block;width:120px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--mod),transparent);background-size:200% 100%;animation:scan 1.4s linear infinite}
@keyframes scan{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- ryuui browse ---------- */
.part{border-radius:var(--r);border:1px solid var(--rim);background:var(--glass);overflow:hidden;margin-top:8px}
.part>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;text-align:left;font-weight:700}
.part>button .n{white-space:nowrap;flex:none;font-family:var(--f-tech);color:var(--dim);font-size:12px}
.part .body{border-top:1px solid var(--rim)}
.sec-link{display:flex;gap:10px;width:100%;padding:9px 14px;background:none;border:0;border-top:1px solid rgba(150,185,255,.08);text-align:left;font-size:14px}
.sec-link:first-child{border-top:0}
.sec-link .code{font-family:var(--f-tech);font-weight:600;color:var(--ryuui);min-width:5.2em}

/* ---------- detail sheet ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(2,4,10,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;
  background:linear-gradient(to bottom,rgba(14,22,50,.97),rgba(5,8,20,.98));border-top:1px solid var(--rim-hi);box-shadow:0 -20px 60px -20px var(--mod);
  padding:0 0 calc(28px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:760px;margin:0 auto;padding-inline:16px}
.sheet .top{margin-inline:-16px;padding-inline:16px}
.sheet .top{position:sticky;top:0;z-index:2;padding-block:12px 12px;background:#0e1632;border-bottom:1px solid var(--rim);box-shadow:0 12px 18px -12px rgba(0,0,0,.8)}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--rim-hi);margin:0 auto 10px}
.sheet .x{float:right;border:1px solid var(--rim);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:12.5px;margin-left:10px}
.sheet h2{font-weight:900;font-size:21px;line-height:1.35;margin:0;word-break:break-all;text-wrap:balance}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px}
.big .v{font-family:var(--f-tech);font-weight:700;font-size:38px;line-height:1;color:var(--mod);text-shadow:0 0 22px color-mix(in srgb,var(--mod) 55%,transparent)}
.big .u{font-size:12.5px;color:var(--dim)}
.blk{margin-top:18px}
.blk h3{font-family:var(--f-tech);font-size:11.5px;letter-spacing:.24em;color:var(--mod);margin:0 0 8px;font-weight:600}
.txt{padding:14px 16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--rim);white-space:pre-wrap;word-break:break-all;line-height:1.85;font-size:14.5px}
.txt a{color:var(--ryuui);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
dl.kv{display:grid;grid-template-columns:6.5em minmax(0,1fr);margin:0;border-radius:var(--r);border:1px solid var(--rim);overflow:hidden;font-size:13.5px}
dl.kv dt,dl.kv dd{padding:8px 12px;border-top:1px solid rgba(150,185,255,.1);margin:0}
dl.kv dt:first-of-type,dl.kv dt:first-of-type+dd{border-top:0}
dl.kv dt{color:var(--dim);background:rgba(140,170,255,.05);font-size:12.5px}
dl.kv dd{word-break:break-all}
.tbl{overflow-x:auto;border-radius:var(--r);border:1px solid var(--rim)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid rgba(150,185,255,.1);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-tech);font-size:11px;letter-spacing:.12em;color:var(--dim);font-weight:600;background:rgba(140,170,255,.06)}
td.n{text-align:right;font-family:var(--f-tech);font-variant-numeric:tabular-nums;font-weight:600}
td.w{white-space:normal;min-width:10em}
tr.cur td{background:color-mix(in srgb,var(--mod) 14%,transparent)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--glass-hi)}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative;margin-top:4px}
.timeline::before{content:"";position:absolute;left:16%;right:16%;top:19px;height:2px;background:linear-gradient(90deg,var(--faint),var(--mod))}
.tl{text-align:center;position:relative}
.tl .dot{width:14px;height:14px;border-radius:50%;margin:12px auto 8px;background:var(--void);border:2px solid var(--faint);position:relative}
.tl.on .dot{border-color:var(--mod);background:var(--mod);box-shadow:0 0 14px var(--mod)}
.tl .y{font-family:var(--f-tech);font-size:11.5px;color:var(--dim)}
.tl .p{font-family:var(--f-tech);font-weight:700;font-size:17px}
.tl .l{font-size:10.5px;color:var(--faint)}
/* 規格（含量）によって適応が違う薬 */
.warnbox{padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--text);font-size:13px;line-height:1.6}
.warnbox::before{content:"⚠ ";color:var(--warn);font-weight:700}
.subh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--dim)}
.pill{font-family:var(--f-tech);font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--rim-hi)}
.pill.on{background:var(--mod);border-color:var(--mod);color:var(--void)}
.txt.dim{color:var(--dim)}
.txt .only{font-size:12px;color:var(--warn);margin-left:4px}
table.mx th.c,table.mx td.c{text-align:center;white-space:normal;min-width:4.6em;font-size:11.5px}
table.mx th.me,table.mx td.me{background:color-mix(in srgb,var(--mod) 16%,transparent)}
table.mx th.me{color:var(--mod)}
table.mx .yes{color:var(--mod);font-size:14px;text-shadow:0 0 8px var(--mod)}
table.mx .no{color:var(--faint)}
table.mx td.w{min-width:12em;font-size:12.5px}
details.raw{margin-top:10px}
details.raw summary{cursor:pointer;font-size:12.5px;color:var(--dim);padding:6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--rim-hi);background:var(--glass);color:var(--text);text-decoration:none;font-size:13.5px}
.btn.pri{background:var(--mod);border-color:var(--mod);color:var(--void);font-weight:700;box-shadow:0 0 22px -4px var(--mod)}
.note{font-size:12px;color:var(--faint);line-height:1.65}
.navpn{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.navpn button{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--rim);background:var(--glass);text-align:left;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navpn button:last-child{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{padding:10px 12px;border-radius:var(--r);border:1px solid var(--rim);background:var(--glass)}
.stat .k{font-size:11.5px;color:var(--dim)}
.stat .v{font-family:var(--f-tech);font-weight:700;font-size:24px}
.stat.dn .v{color:var(--down)} .stat.up .v{color:var(--up)}
.cmpbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:10px;background:rgba(255,255,255,.05)}
.cmpbar i{display:block}

/* ---------- dock ---------- */
nav.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border-radius:22px;
  background:rgba(8,14,34,.82);border:1px solid var(--rim);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -10px #000}
nav.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 1px;border:0;border-radius:16px;background:none;color:var(--dim);font-size:10.5px;font-weight:700;white-space:nowrap;min-width:0}
nav.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.dock button[aria-selected="true"]{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent) inset}
.badge{font-family:var(--f-tech);font-size:9.5px;background:var(--yakka);color:var(--void);border-radius:999px;padding:0 5px;margin-left:2px}
/* ---------- 本文の重要語の強調 ---------- */
.em-n{color:var(--up);font-weight:700;background:color-mix(in srgb,var(--up) 12%,transparent);border-radius:3px;padding:0 2px}
.em-c{color:var(--warn);font-weight:700;border-bottom:1px dashed color-mix(in srgb,var(--warn) 70%,transparent)}
.em-f{color:var(--core);font-weight:700;background:color-mix(in srgb,var(--core) 12%,transparent);border-radius:3px;padding:0 2px}
.em-u{color:var(--yakka);font-weight:700;font-family:var(--f-tech)}
.txt a{font-weight:700}
.emlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin:6px 0 0}
.emlegend span{display:inline-flex;align-items:center;gap:4px}

/* ---------- DPC ---------- */
.dcode{font-family:var(--f-tech);font-weight:700;letter-spacing:.06em;font-size:1.05em}
.dcode i{font-style:normal;color:var(--dim)}
.dcode b{color:var(--dpc)}
.dpc-head{padding:14px 16px;margin-top:14px}
.dpc-head .dh{font-weight:900;font-size:17px;margin:4px 0}
.dpc-head .code{font-family:var(--f-tech);color:var(--dpc);margin-right:6px}
.progress{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--dpc),var(--core));box-shadow:0 0 12px var(--dpc);transition:width .35s}
.linkbtn{background:none;border:0;color:var(--dpc);font-size:12px;text-decoration:underline}
.facets{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.facet{border:1px solid var(--rim);border-radius:var(--r);background:var(--glass);padding:10px}
.facet .fh{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-weight:900;font-size:14px}
.facet .fh small{font-family:var(--f-tech);color:var(--dim);font-weight:600;font-size:11px}
.facet .clr{margin-left:auto;background:none;border:0;color:var(--dpc);font-size:12px;text-decoration:underline}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;margin-top:6px;border-radius:12px;border:1px solid var(--rim);background:rgba(8,16,38,.55);color:var(--text)}
.opt .ov{font-family:var(--f-tech);font-weight:700;color:var(--dpc);min-width:1.8em;text-align:center}
.opt .ol b{display:block;font-size:13.5px}
.opt .ol small{display:block;font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:2px;word-break:break-all}
.opt .oc{font-family:var(--f-tech);font-size:12px;color:var(--dim)}
.opt.on{border-color:var(--dpc);background:color-mix(in srgb,var(--dpc) 16%,transparent);box-shadow:0 0 18px -6px var(--dpc)}
.opt:disabled{opacity:.35}
.confirm{margin-top:14px;padding:12px;border-radius:var(--r);border:1px solid var(--core);background:color-mix(in srgb,var(--core) 8%,transparent);box-shadow:0 0 30px -12px var(--core)}
.confirm .eyebrow{--mod:var(--core);margin-bottom:8px}
.card.big .dcode{font-size:1.25em}
h3.gh{font-size:14px;font-weight:900;margin:18px 0 8px}
.lbars{display:flex;flex-direction:column;gap:14px}
.lbar .ly{font-size:12px;color:var(--dim);margin-bottom:4px}
.ltrack{position:relative;height:22px;border-radius:6px;background:rgba(255,255,255,.05);margin-bottom:14px}
.ltrack i{position:absolute;top:0;height:100%;display:block}
.ltrack i.p1{left:0;background:color-mix(in srgb,var(--dpc) 75%,transparent);border-radius:6px 0 0 6px}
.ltrack i.p2{background:color-mix(in srgb,var(--dpc) 42%,transparent)}
.ltrack i.p3{background:color-mix(in srgb,var(--dpc) 18%,transparent);border-radius:0 6px 6px 0}
.ltrack b{position:absolute;top:24px;transform:translateX(-50%);font-family:var(--f-tech);font-size:11px;color:var(--text)}
.lnone{font-size:12.5px;color:var(--faint);padding:4px 0 8px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:2px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.legend i.p1{background:color-mix(in srgb,var(--dpc) 75%,transparent)} .legend i.p2{background:color-mix(in srgb,var(--dpc) 42%,transparent)} .legend i.p3{background:color-mix(in srgb,var(--dpc) 18%,transparent)}
.v.icd{font-size:16px;color:var(--byomei)}
/* 高額薬剤・高額検査 */
.kg{padding:10px 12px;margin-top:8px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.kgh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kgh .pill{border-color:var(--warn);color:var(--warn);font-size:11px}
.kgh b{font-size:14.5px}
.kgi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin-top:6px;font-size:13px;line-height:1.6}
.kgi .k{font-size:11px;color:var(--dim);white-space:nowrap;padding-top:2px}
.kgn{margin-top:6px}
.kgc{margin-top:8px;border-top:1px solid var(--rim)}
.icdb{font-family:var(--f-tech);color:var(--byomei);font-size:15px;margin-right:6px}

/* ---------- ログイン ---------- */
.login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:radial-gradient(60% 50% at 50% 30%,rgba(79,227,255,.10),transparent 70%),rgba(3,5,12,.94)}
.login-card{width:min(100%,380px);padding:24px 22px;display:flex;flex-direction:column;gap:8px}
.login-card svg{width:46px;height:46px}
.login-card label{font-size:12px;color:var(--dim);margin-top:6px}
.login-card input:not([type=checkbox]){font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--rim-hi);background:rgba(8,16,38,.8);color:var(--text)}
.login-card input:focus{outline:none;border-color:var(--core);box-shadow:0 0 0 3px color-mix(in srgb,var(--core) 25%,transparent)}
.login-card .keep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin-top:8px}
.login-card .err{color:var(--up);font-size:13px;margin:4px 0 0}
.login-card .ok{color:var(--core);font-size:13px;margin:4px 0 0}
.login-card .btn{justify-content:center;margin-top:10px;--mod:var(--core)}
.chip-live.out{background:none;color:var(--dim);border-color:var(--rim);cursor:pointer;margin-left:6px}
@media (max-width:380px){.chip-live.out{display:inline-flex}}
@media (prefers-reduced-motion:reduce){.spin,.node,.ring-pulse,.loading i{animation:none}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(30px);opacity:.5}}
  .view{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>


<div class="backdrop" aria-hidden="true">
  <canvas id="sky"></canvas>
  <div class="nebula"></div>
  <div class="horizon"></div>
</div>

<div class="shell">
  <header class="bar">
    <button class="logo" id="go-home" aria-label="ホームへ">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="5" fill="#7dffcf"/><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#4fe3ff" stroke-width="1.4" transform="rotate(-25 20 20)"/><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#b38cff" stroke-width="1.4" transform="rotate(35 20 20)"/><circle cx="34" cy="13" r="2.6" fill="#ffc46b"/></svg>
      <span><b>保険診療オービット</b><small>INSURANCE&nbsp;MEDICAL&nbsp;ORBIT</small></span>
    </button>
    <span class="sp"></span>
    <span class="chip-live" id="live"><i></i>SYNC</span>
  </header>
  <main id="view" class="view"></main>
</div>

<nav class="dock" aria-label="モジュール切替"><div class="in" role="tablist">
  <button role="tab" data-go="home" style="--c:var(--core)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-25 12 12)"/></svg>ホーム</button>
  <button role="tab" data-go="yakka" style="--c:var(--yakka)"><svg viewBox="0 0 24 24"><rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9.2 8 14.8 16" transform="rotate(0)"/></svg><span>薬価<span class="badge" id="pinc" hidden></span></span></button>
  <button role="tab" data-go="kensa" style="--c:var(--kensa)"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>点数</button>
  <button role="tab" data-go="dpc" style="--c:var(--dpc)"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12h4m0-7v14m0-14h6m-6 7h6m-6 7h6"/></svg>DPC</button>
  <button role="tab" data-go="byomei" style="--c:var(--byomei)"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/><path d="M9 12h6M12 9v6"/></svg>病名</button>
  <button role="tab" data-go="ryuui" style="--c:var(--ryuui)"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>留意</button>
</div></nav>

<div id="sheet-root"></div>
<script src="flavor.js"></script>
<script src="cls.js"></script>
<script src="vault.js"></script>
<script src="emph.js"></script>
<script src="app.js"></script>


<script src="boot.js"></script>

</body>
</html>
